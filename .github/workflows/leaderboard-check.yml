name: leaderboard-check
# Validates cleaning rules and rebuilds leaderboard.json whenever scores or
# scripts change. Does NOT run evaluations (manual, per README §Adding a new
# model). Fails the push if the paper cohort stops reproducing Table 2 or if
# the committed JSON is out of sync with the CSV.

on:
  push:
    paths:
      - "results/**"
      - "scripts/**"
      - "docs/data/leaderboard.json"
  pull_request:
    paths:
      - "results/**"
      - "scripts/**"
      - "docs/data/leaderboard.json"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build script derives last_updated from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate scores (canonical cleaning rules, both judges)
        run: |
          python3 scripts/validate_scores.py results/scores/opus46_all239_per_dimension_long.csv
          python3 scripts/validate_scores.py results/scores/gpt55_all239_per_dimension_long.csv
      - name: Build leaderboards (acceptance gates)
        run: python3 scripts/build_leaderboard.py
      - name: Committed JSON must match rebuilt JSON
        run: git diff --exit-code docs/data/leaderboard.json docs/data/leaderboard_gpt55.json
